services:
  backend:
    image: python:3.12-slim
    container_name: backend
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: >
      bash -c "
      pip install uv &&
      uv sync &&
      uv run uvicorn main:app --reload --host 0.0.0.0 --port 8000
      "
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    image: oven/bun:latest
    container_name: frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: >
      sh -c "
      bun install &&
      bun run dev --host 0.0.0.0
      "
    depends_on:
      - backend
